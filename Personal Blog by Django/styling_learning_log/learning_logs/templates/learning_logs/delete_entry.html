{% extends "learning_logs/base.html" %}

{% block page_header %}
  <div class="mb-3">
    <a href="{% url 'learning_logs:topic' topic.id %}" 
       class="text-decoration-none text-muted">
      ← 返回主题
    </a>
  </div>
  <h1 class="mb-4" style="color: #2c3e50;">
    ⚠️ 删除笔记确认
  </h1>
  <p class="text-muted mb-0">
    主题：<span class="fw-semibold">{{ topic.text }}</span>
  </p>
{% endblock page_header %}

{% block content %}
  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <div class="alert alert-warning mb-4" role="alert">
        <h5 class="alert-heading">⚠️ 警告</h5>
        <p class="mb-0">删除此笔记后无法恢复，请确认是否继续。</p>
      </div>

      <div class="mb-4">
        <p class="text-muted">
          <strong>创建时间：</strong>{{ entry.date_added|date:'Y年m月d日 H:i' }}
        </p>
        <div class="card bg-light">
          <div class="card-body">
            <div class="entry-content" style="color: #444; line-height: 1.8;">
              {{ entry.text|linebreaks }}
            </div>
          </div>
        </div>
      </div>

      <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-danger btn-lg px-4">
            🗑️ 确认删除
          </button>
          <a href="{% url 'learning_logs:topic' topic.id %}" 
             class="btn btn-outline-secondary btn-lg px-4">
            ↩️ 取消
          </a>
        </div>
      </form>
    </div>
  </div>
{% endblock content %}
