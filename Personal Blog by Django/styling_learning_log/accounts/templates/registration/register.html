{% extends "learning_logs/base.html" %}
{% load django_bootstrap5 %}

{% block page_header %}
  <h1 class="mb-4" style="color: #2c3e50;">
    ✨ 注册新账户
  </h1>
{% endblock page_header %}

{% block content %}
  <div class="card shadow-sm border-0" style="max-width: 500px; margin: 0 auto;">
    <div class="card-body p-4">
      <p class="lead mb-4 text-center" style="color: #555;">
        🎉 加入我们，开始记录你的学习之旅！
      </p>

  <form action="{% url 'accounts:register' %}" method='post'>
    {% csrf_token %}
        {% bootstrap_form form %}
        <div class="mt-4 text-center">
          <button name="submit" class="btn btn-primary btn-lg px-5">
            ✅ 注册
          </button>
        </div>
  </form>

      <div class="mt-4 text-center">
        <p class="text-muted mb-0">
          已有账户？
          <a href="{% url 'accounts:login' %}" class="text-decoration-none">
            🔑 立即登录
          </a>
        </p>
      </div>
    </div>
  </div>

{% endblock content %}
