[tool.black]
line-length = 100
target-version = ["py311"]
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
combine_as_imports = true
force_grid_wrap = 0
ensure_newline_before_comments = true
known_first_party = ["learning_logs", "accounts", "ll_project"]
skip = ["env", ".venv", "build", "dist", "static", "media", "migrations"]

